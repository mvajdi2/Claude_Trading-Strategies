id: marketplaces-ema-pullback-adx-m15
name: EMA20/50 + ADX trend, pullback to EMA20 (M15)
mechanism: momentum
timeframe_signal: 15m
session: "07:00-19:00 UTC"
entry:
  long:  "EMA20 > EMA50 (15m) AND ADX14 > 25 AND close(H1) > EMA50(H1) AND low touches EMA20 AND bar closes back above EMA20"
  short: "EMA20 < EMA50 AND ADX14 > 25 AND close(H1) < EMA50(H1) AND high touches EMA20 AND close back below EMA20"
  order: market
stop: "swing extreme of pullback - 0.5*ATR14, or 1.5*ATR14 (whichever farther)"
target: "trail 2*ATR14 after +1R; breakeven at 1R; or fixed 3*ATR"
time_exit: "20:45 UTC"
filters: ["max 2 trades per day", "skip if ATR14(15m) < 20-day median (dead market)"]
params:
  adx_min:    {default: 25, grid: [20, 25, 30]}
  stop_atr:   {default: 1.5, grid: [1.0, 1.5, 2.0]}
  exit_mode:  {default: trail, grid: [trail, "fixed_3atr"]}
expected_frequency: "~1 per day"
claimed: "none"
assumptions: ["ADX threshold, ATR-dead-market filter, H1 EMA length, trail distance invented; stop/target formulas taken from MQL5 job specs, not tested code"]
sources:
  - https://www.mql5.com/fr/market/product/188049
  - https://www.mql5.com/en/job/251720
  - https://www.mql5.com/ru/job/250597
notes: "Generic trend-pullback; included as the intraday trend baseline the other cards should beat."
