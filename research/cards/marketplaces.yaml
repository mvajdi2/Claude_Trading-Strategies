id: marketplaces-london-range-ny-breakout-30m
name: London session range breakout in first 90 min of New York (30m)
mechanism: session_time
timeframe_signal: 30m
session: "London range 07:00-12:00 UTC; entries 12:30-14:00 UTC (first three NY 30m bars)"
entry:
  long:  "30m close > LondonHigh during the first three 30m bars of NY AND close not above upper BB(20,2) zone"
  short: "30m close < LondonLow during the first three 30m bars of NY AND close not below lower BB(20,2) zone"
  order: market
stop: "opposite London extreme"
target: "1R or outer Bollinger Band (20,2), whichever first"
time_exit: "20:00 UTC"
filters: ["max 1 trade per day", "skip if London range > 2.5*ATR14(30m) (stop too wide)"]
params:
  ny_bars:      {default: 3, grid: [2, 3, 4]}
  target_r:     {default: 1.0, grid: [1.0, 1.5, 2.0]}
  london_start: {default: "07:00", grid: ["06:00", "07:00", "08:00"]}
expected_frequency: "~3 per week"
claimed: "none"
assumptions:
  - "London hours, NY start 12:30 UTC, BB(20,2) zone interpretation and range-size filter are researcher choices; script describes 'red/green zone' skip rules without exact definition"
sources:
  - https://it.tradingview.com/script/DWZ43m2q-GOLD-30MIN-ALLINONE
notes: >
  Uses a whole London-session range rather than a scheduled minute; stop is wide, so the edge depends
  on NY continuation days. Check DST shifts on NY open.
