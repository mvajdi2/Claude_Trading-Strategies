id: marketplaces-pdh-pdl-oco-breakout
name: Previous-day high/low OCO breakout, one trade per day
mechanism: breakout
timeframe_signal: 5m
session: "orders placed 00:05 UTC, active until 18:00 UTC"
entry:
  long:  "buy stop at PDH (+ buffer)"
  short: "sell stop at PDL (- buffer); cancel the other on fill"
  order: stop
stop: "1.0 * ATR14(H1) from entry, or daily midpoint, param"
target: "2R"
time_exit: "20:00 UTC"
filters: ["no trading on weekend sessions", "skip if price already outside PDH/PDL at placement", "max 1 trade per day"]
params:
  buffer_usd: {default: 0.3, grid: [0.0, 0.3, 1.0]}
  stop_atr:   {default: 1.0, grid: [0.5, 1.0, 1.5]}
  target_r:   {default: 2.0, grid: [1.0, 1.5, 2.0, 3.0]}
  require_close_beyond: {default: false, grid: [false, true]}
expected_frequency: "~0.6 per day"
claimed: "none"
assumptions: ["stop, target and active hours invented; listings only define stop orders at PDH/PDL, OCO, 1 trade/day"]
sources:
  - https://www.mql5.com/ja/market/product/188195
  - https://www.mql5.com/en/market/product/145590
  - https://www.mql5.com/ko/job/251869
notes: >
  Variant with require_close_beyond=true follows the stricter close-based spec in the MQL5 job post
  (on 15m closes here, to stay intraday). Pairs with the Taylor-sweep card (same levels, opposite thesis).
