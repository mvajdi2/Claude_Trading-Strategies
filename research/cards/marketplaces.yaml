id: marketplaces-bb-pinbar-fade-m5
name: Bollinger close-outside + pin bar fade, H1 EMA200 aligned (M5)
mechanism: mean_reversion
timeframe_signal: 5m
session: "07:00-20:00 UTC"
entry:
  long:  "prior 5m bar closed below lower BB(20,2) AND current completed bar is a bullish pin (lower wick >= 2*body, close in top third) AND close(H1) > EMA200(H1)"
  short: "prior 5m bar closed above upper BB(20,2) AND bearish pin AND close(H1) < EMA200(H1)"
  order: market
stop: "pin bar extreme + 0.3 USD"
target: "BB middle band (20 SMA), or 1.5R param"
time_exit: "60 min after entry or 20:45 UTC"
filters: ["one position at a time", "skip if spread > 0.4 USD"]
params:
  bb_dev:      {default: 2.0, grid: [2.0, 2.5, 3.0]}
  wick_body:   {default: 2.0, grid: [1.5, 2.0, 3.0]}
  target_mode: {default: middle, grid: [middle, "1.0R", "1.5R"]}
expected_frequency: "~1 per day"
claimed: "PF 3.75 on 33 trades, Nov 2025-Apr 2026, 28 longs (seller backtest)"
assumptions: ["pin-bar geometry, session, stop buffer, time exit invented"]
sources:
  - https://www.mql5.com/en/market/product/174110
  - https://www.mql5.com/tr/market/product/185384
  - https://www.mql5.com/en/market/product/181332
notes: >
  Seller sample is tiny and long-biased in a gold bull run; the EMA200 filter means it is really a
  buy-the-dip-in-uptrend system. Check symmetry and the post-June-2026 regime explicitly.
---
id: marketplaces-round20-level-fade
name: $20 round-number rejection fade
mechanism: structure
timeframe_signal: 15m
session: "06:00-20:00 UTC"
entry:
  long:  "price falls to within 1.00 USD above a multiple of 20 USD with momentum (close-to-close drop over last 4 bars >= 1*ATR14(15m)) -> buy limit at level + 0.50"
  short: "price rises to within 1.00 USD below a multiple of 20 with momentum -> sell limit at level - 0.50"
  order: limit
stop: "2.50 USD beyond the round level (author found no effect by $3)"
target: "1.5 * stop distance, or 4h time exit"
time_exit: "4 hours after entry or 20:45 UTC"
filters: ["max 1 trade per level per day", "skip 30 min around scheduled US data", "first touch of the level today only"]
params:
  level_step: {default: 20, grid: [10, 20, 25, 50]}
  stop_beyond: {default: 2.5, grid: [1.5, 2.5, 3.5]}
  momentum_atr: {default: 1.0, grid: [0.5, 1.0, 1.5]}
  target_r:   {default: 1.5, grid: [1.0, 1.5, 2.0]}
expected_frequency: "~1 per day"
claimed: "MQL5 blog: on 8.5y H1 data, momentum approaches to $20 levels reverse more often than control; effect ~$1 wide, gone by $3; absent on FX majors"
assumptions:
  - "author's study was a statistic on H1, not a strategy; all entry/stop/target rules and the 15m momentum definition are researcher-built"
  - "limit orders: note T5 found limit entries suffer adverse selection — also test market-on-touch"
sources:
  - https://www.mql5.com/en/blogs/post/775454
  - https://www.mql5.com/en/forum/493180/57798605
  - https://jp.tradingview.com/script/Ggfalp0D-Big-Round-Number-for-GOLD-XAU-USD
notes: >
  Only card here backed by a (self-published) statistical test with a control. Grid level_step to see
  if $20 is special versus $10/$25/$50. Gold price level has risen a lot, so $20 is now a smaller
  fraction of price than in early sample years.
---
id: marketplaces-vwap-cross-mtf-ema-5m
name: VWAP cross with H1/H4 EMA trend filter (5m)
mechanism: vwap
timeframe_signal: 5m
session: "07:00-19:00 UTC"
entry:
  long:  "5m close crosses above session VWAP AND close(H1) > EMA50(H1) AND close(H4) > EMA50(H4)"
  short: "5m close crosses below VWAP AND close(H1) < EMA50(H1) AND close(H4) < EMA50(H4)"
  order: market
stop: "1.5 * ATR14(5m)"
target: "TP1 1.5*ATR (50%), TP2 3.0*ATR (rest), stop to breakeven after TP1"
time_exit: "20:45 UTC"
filters: ["max 3 trades per day", "no new entry within 6 bars of last exit"]
params:
  stop_atr:  {default: 1.5, grid: [1.0, 1.5, 2.0]}
  tp2_atr:   {default: 3.0, grid: [2.0, 3.0, 4.0]}
  ema_len:   {default: 50, grid: [20, 50, 100, 200]}
  vwap_anchor: {default: "00:00 UTC", grid: ["00:00 UTC", "07:00 UTC", "13:30 UTC"]}
expected_frequency: "~1-3 per day"
claimed: "none"
assumptions: ["EMA lengths, VWAP anchor, session, re-entry spacing and TP1 split invented; listing gives VWAP break + H1/H4 EMA filters + 1.5x/3x ATR"]
sources:
  - https://it.tradingview.com/script/pZRLoihP-XAUUSD-Ultra
  - https://de.tradingview.com/script/VrdATmT4-PowerTrend-Pro-Strategy-Gold-Optimized/
  - https://in.tradingview.com/script/uXwRMzy9-RSI-Scalping-Gold-XAUUSD-v5
notes: "Trend-continuation via VWAP; whipsaws on range days. vwap_anchor grid tests session-anchored VWAP."
