# Lane 1: code marketplaces (TradingView, MQL5, cTrader, GitHub). Researched 2026-10-23.
# TradingView / mql5.com / ctrader.com could not be fetched (ENOTFOUND); rules come from search-result
# summaries of the listings. All times UTC unless stated. All positions flat by 21:00 UTC.
id: marketplaces-asian-range-oco-breakout
name: Asian range OCO stop breakout (London/NY)
mechanism: breakout
timeframe_signal: 5m
session: "range 00:00-06:00 UTC; orders live 06:00-16:00 UTC"
entry:
  long:  "buy stop at AsianHigh + buffer, placed at 06:00 UTC"
  short: "sell stop at AsianLow - buffer, placed at 06:00 UTC; when one fills cancel the other (OCO)"
  order: stop
stop: "opposite side of the Asian range (or midpoint, param)"
target: "1.5 * range width"
time_exit: "close any open position at 16:00 UTC; delete unfilled orders at 12:00 UTC"
filters:
  - "skip day if range width < 3.00 or > 20.00 USD (vendor's 300-2000 points 'normal day' filter)"
  - "skip day if spread at placement > 0.35 USD (InpMaxSpreadPoints=350)"
  - "optional HTF trend filter: no shorts if close > SMA100(W1), no longs if below"
  - "max 1 trade per day"
params:
  range_end_utc:  {default: "06:00", grid: ["05:00", "06:00", "07:00"]}
  buffer_usd:     {default: 0.50, grid: [0.0, 0.25, 0.5, 1.0]}
  target_x_range: {default: 1.5, grid: [0.75, 1.0, 1.5, 2.0]}
  stop_mode:      {default: opposite, grid: [opposite, midpoint]}
expected_frequency: "~0.8 per day"
claimed: "none verified (vendor backtests only)"
assumptions:
  - "range window 00:00-06:00 UTC chosen (vendors use 22:00-05:00 GMT or 03:00-06:00 server time)"
  - "order cancel time 12:00 and flat time 16:00 UTC invented"
  - "300-2000 points mapped to 3-20 USD assuming 1 point = 0.01"
  - "buffer default invented"
sources:
  - https://www.mql5.com/en/blogs/post/777094
  - https://www.mql5.com/en/code/75586
  - https://www.mql5.com/en/market/product/166774
  - https://www.mql5.com/fr/market/product/176400
  - https://www.mql5.com/fr/market/product/169819
  - https://ctrader.com/products/3918
notes: >
  The most widely sold gold EA archetype across MQL5 and cTrader. Not in the tested registry (T7 tested
  momentum/fade at scheduled anchors, not a range-defined OCO breakout). Failure mode: London open
  stop-hunts both sides; the range-width filter and buffer are the key parameters.
---
id: marketplaces-asian-range-fakeout-h1
name: Asian range failed-breakout fade (H1)
mechanism: structure
timeframe_signal: 1h
session: "range 00:00-06:00 UTC; signals 06:00-17:00 UTC"
entry:
  long:  "an H1 bar closed below AsianLow, and a later H1 bar closes back inside the range (close > AsianLow) -> buy at that close"
  short: "an H1 bar closed above AsianHigh, and a later H1 bar closes back inside the range (close < AsianHigh) -> sell at that close"
  order: market
stop: "extreme of the excursion outside the range + 0.2*ATR14(H1)"
target: "opposite side of the Asian range (or 2R, whichever first)"
time_exit: "20:00 UTC"
filters: ["max 1 trade per day", "skip if the opposite side of the range was also broken first"]
params:
  stop_buffer_atr: {default: 0.2, grid: [0.0, 0.2, 0.5]}
  target_mode:     {default: opposite_side, grid: [midpoint, opposite_side, "2R"]}
  max_bars_outside: {default: 3, grid: [1, 2, 3, 5]}
expected_frequency: "~2-3 per week"
claimed: "none"
assumptions:
  - "Asian session hours, stop, target, time exit and max_bars_outside are researcher choices; the listing only gives close-outside then close-back-inside, trade opposite"
sources:
  - https://www.tradingview.com/script/8Iv42BDE-Gold-H1-Breakout-Failure-V11-0
notes: >
  Materially different from T4 (sub-5s sweeps of 15/30-min levels): H1 bar closes, session-range level,
  hours-long holding. Natural mirror of the OCO breakout card; test both on the same days.
---
id: marketplaces-taylor-sweep-1m
name: Asian/prior-day level sweep reversal with SuperTrend + VWAP reclaim (1m)
mechanism: structure
timeframe_signal: 1m
session: "06:00-17:00 UTC (London 06-13 sweeps, NY 13-17 continuation)"
entry:
  long:  "low(1m) < min(AsianLow, PDL) AND close(1m) > that level AND lower wick >= 50% of bar range AND SuperTrend(10,3, 1m) bullish AND (close > session VWAP OR close > EMA20)"
  short: "high(1m) > max(AsianHigh, PDH) AND close(1m) < that level AND upper wick >= 50% of bar range AND SuperTrend bearish AND (close < VWAP OR close < EMA20)"
  order: market
stop: "6.00 USD (script default 6-point stop) or sweep extreme + 0.5 USD, param"
target: "3R, scaled 33/33/34 at 1R, 2R, 3R"
time_exit: "17:00 UTC (end of NY window)"
filters: ["Asian range 00:00-05:00 UTC", "one trade per level per day"]
params:
  stop_usd:     {default: 6.0, grid: [3.0, 4.5, 6.0, 8.0]}
  final_r:      {default: 3.0, grid: [1.5, 2.0, 3.0]}
  wick_frac:    {default: 0.5, grid: [0.3, 0.5, 0.6]}
  st_params:    {default: "10,3", grid: ["7,2", "10,3", "14,3"]}
expected_frequency: "~0.5-1 per day"
claimed: "none"
assumptions:
  - "wick fraction threshold and SuperTrend(10,3) settings invented"
  - "level = Asian extreme or PDL/PDH, whichever is swept first"
sources:
  - https://es.tradingview.com/scripts/asian
  - https://jp.tradingview.com/scripts/taylor
  - https://vn.tradingview.com/scripts/usdollar
notes: >
  Differs from T1/T4 (sub-5s spark/sweep at 15/30-min levels, order-flow features): uses daily/session
  levels, 1m bar closes and requires trend (SuperTrend) plus VWAP agreement, so it is a confirmed
  reversal, not a spike fade. Risk: the SuperTrend-bullish requirement right after a sweep down is
  rare; it may reduce to a late entry.
---
id: marketplaces-ny-orb-15m-5m
name: Gold New York opening range breakout (15m range, 5m close entry)
mechanism: breakout
timeframe_signal: 5m
session: "range 09:30-09:45 America/New_York; entries until 12:00 NY"
entry:
  long:  "first 5m close > ORhigh after 09:45 NY"
  short: "first 5m close < ORlow after 09:45 NY"
  order: market
stop: "0.5 * OR width from entry (range midpoint)"
target: "2.0 * OR width"
time_exit: "15:00 NY (always before 21:00 UTC)"
filters: ["max 1 trade per day", "optional: skip if OR width > 1.5*ATR14(15m)"]
params:
  or_minutes: {default: 15, grid: [5, 15, 30]}
  target_x:   {default: 2.0, grid: [1.0, 1.5, 2.0, 3.0]}
  stop_x:     {default: 0.5, grid: [0.5, 1.0]}
expected_frequency: "~1 per day"
claimed: "third-party MT5 3-year test: +49.4%, PF 1.68, WR 46.8%, maxDD 5.9%, 169 trades (seller figures)"
assumptions: ["entry cutoff 12:00 NY, flat time 15:00 NY, and OR-width filter invented"]
sources:
  - https://kr.tradingview.com/script/oYW9gdag-Gold-ORB-Strategy-15-min-Range-5-min-Entry
  - https://calyx.duckdns.org/eas/orb-volume-profile
  - https://ctrader.com/products/1705
notes: >
  T8 tested first-minute NYSE momentum and T7 anchor momentum; this is a 15-minute range breakout
  confirmed by a 5m close with a range-scaled bracket, a different trigger and holding period. Still
  shares the NYSE-open anchor, so expect correlated weakness; worth one test because it is the most
  common gold ORB template.
