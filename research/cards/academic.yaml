id: academic-shfe-open-momentum
name: Shanghai day-session open half-hour predicts rest of Asian session
mechanism: momentum
timeframe_signal: 5m
session: "01:00-06:30 UTC"
entry:
  long:  "at 01:30 UTC: r = return 01:00->01:30 UTC (SHFE gold day open 09:00 Beijing) > +q * sigma_r (60-day stdev)"
  short: "r < -q * sigma_r"
  order: market
stop: "price at 01:00 UTC (start of signal window)"
target: "none (time exit)"
time_exit: "06:30 UTC; variant 03:30 UTC (SHFE lunch break)"
filters:
  - "skip Chinese public holidays (SHFE closed)"
  - "variant: also use SHFE night open 21:00 Beijing = 13:00 UTC, first half hour, held to 15:00 UTC"
params:
  q:              {default: 0.5, grid: [0.0, 0.5, 1.0]}
  exit_utc:       {default: "06:30", grid: ["03:30", "05:00", "06:30"]}
  anchor:         {default: "day_open_01:00", grid: ["day_open_01:00", "night_open_13:00"]}
expected_frequency: "~0.5 per day"
claimed: "Bouri-Ma-Xu-Zhou: first half-hour of Chinese metal futures (incl. gold/silver) predicts later returns; after night trading started the night-open half-hour became the predictor; market-timing strategy beat always-long"
assumptions:
  - "Transferring Chinese-futures intraday momentum to XAUUSD spot via the SHFE open time is a researcher assumption"
  - "Thresholds and exits are researcher choices"
sources:
  - https://ideas.repec.org/a/eee/finlet/v58y2023ipas154461232300394x.html
  - https://ideas.repec.org/a/eee/glofin/v64y2025ics1044028325000110.html
  - https://acfr.aut.ac.nz/__data/assets/pdf_file/0008/686816/4a-Z-Ivy-Zhou.pdf
notes: "Not among T7 anchors (T7 had Tokyo open 00:00 UTC). Chinese onshore premium/physical demand flows hit at the SHFE/SGE open. The night-open variant collides with 12:30/13:30 UTC US data; exclude data days for that variant."
