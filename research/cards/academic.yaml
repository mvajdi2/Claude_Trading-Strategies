id: academic-tsmom-daysession-volscaled
name: Daily trend sign held intraday only, volatility-scaled, with semivariance reversal filter
mechanism: momentum
timeframe_signal: 1h
session: "07:00-20:55 UTC"
entry:
  long:  "at 07:00 UTC: sign of EMA(20) - EMA(100) on daily closes (21:00 UTC) > 0 AND RS_share <= 0.6"
  short: "EMA(20) - EMA(100) < 0 AND RS_share <= 0.6"
  order: market
stop: "1.5 * ATR14(1h) * sqrt(14) from entry (about one daily ATR)"
target: "none (time exit)"
time_exit: "20:55 UTC"
filters:
  - "RS_share = (realized semivariance against trend direction) / total realized variance over last 5 days from 5m returns; > 0.6 flags reversal risk, skip"
  - "size = target_vol / realized vol (20-day, intraday 07:00-21:00 returns only)"
params:
  fast_slow:      {default: [20, 100], grid: [[10, 50], [20, 100], [50, 200]]}
  rs_th:          {default: 0.6, grid: [0.5, 0.6, 0.7, 1.0]}
  target_vol:     {default: 0.01, grid: [0.005, 0.01, 0.015]}
expected_frequency: "~0.8 per day"
claimed: "Liu-Lu-Li-Wang (JEF 2023): realized semivariance predicts commodity futures returns around TSMOM reversals, higher Sharpe than plain TSMOM, robust to vol scaling. Kim-Tse-Wald: much of TSMOM alpha comes from volatility scaling"
assumptions:
  - "Restricting a daily TSMOM signal to the 07:00-20:55 UTC window and the semivariance filter definition are researcher choices"
sources:
  - https://reading-clone.eprints-hosting.org/111035
  - https://centaur.reading.ac.uk/111035/1/Anonymized%20manuscript-R1.pdf
  - https://quantpedia.com/?p=637
notes: "Gives the lane a slow-signal intraday strategy uncorrelated with event anchors. Note gold's overnight vs day split: if most trend return is earned in Asian hours, day-only holding loses it; test session_start 00:05 UTC as a variant."
