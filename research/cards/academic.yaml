id: academic-rest-of-day-last30-momentum
name: Rest-of-day return predicts last 30 min before COMEX settlement (hedging-demand intraday momentum)
mechanism: momentum
timeframe_signal: 1m
session: "13:00-13:30 America/New_York (17:00-17:30 UTC in EDT, 18:00-18:30 UTC in EST)"
entry:
  long:  "at 13:00 NY time: r_rod = ln(price 13:00 NY / price 18:00 NY previous day) > +k * sigma_rod, where sigma_rod = stdev of r_rod over last 60 days"
  short: "at 13:00 NY time: r_rod < -k * sigma_rod"
  order: market
stop: "2.5 * ATR14(1m) at entry (disaster stop only; trade is meant to be time-exited)"
target: "none (time exit)"
time_exit: "13:30 NY time (COMEX gold settlement), with variant to hold until 20:55 UTC"
filters:
  - "skip if r_rod magnitude below k*sigma_rod (k default 0.5)"
  - "skip US half-days / holidays"
  - "optional: only on days where realized vol 18:00-13:00 NY > 60-day median (paper: effect stronger on volatile days)"
params:
  k:              {default: 0.5, grid: [0.0, 0.25, 0.5, 1.0]}
  signal_end_ny:  {default: "13:00", grid: ["12:30", "13:00"]}
  exit_ny:        {default: "13:30", grid: ["13:30", "14:00", "16:55 (=20:55 UTC EDT)"]}
  vol_filter:     {default: false, grid: [false, true]}
expected_frequency: "~0.5-1 per day (depends on k)"
claimed: "Baltussen et al. (JFE 2021): last-30-min return positively predicted by rest-of-day return across >60 futures incl. commodities, 1974-2020; economically and statistically significant, reverts over next days"
assumptions:
  - "Paper uses each contract's own close; I map gold's close to the 13:30 NY COMEX settlement because that is when hedging/settlement flow concentrates"
  - "k threshold, sigma normalisation, disaster stop and 20:55 UTC variant are researcher choices"
sources:
  - https://pure.eur.nl/en/publications/hedging-demand-and-market-intraday-momentum/
  - https://alphaarchitect.com/hot-topic-does-gamma-hedging-actually-affect-stock-prices/
  - https://www3.nd.edu/~zda/intramom.pdf
notes: "Differs from T7 (which traded short reactions around the COMEX close anchor): the predictor here is the whole ~19h rest-of-day return, not the move around the anchor. Mechanism (gamma hedging of options/leveraged ETFs, e.g. GLD/NUGT rebalancing near close) is plausible for gold. Edge per trade is small; spread cost is the main risk. Test both the 13:30 settlement and the 21:00 UTC cut-off as 'close'."
---
id: academic-noise-area-momentum
name: Noise-area breakout intraday momentum with VWAP trailing stop (Zarattini-Aziz-Barbon adapted to XAUUSD)
mechanism: momentum
timeframe_signal: 30m
session: "07:00-20:55 UTC"
entry:
  long:  "evaluated at each 30m bar close from 07:30 UTC: close > upper_band(t) where upper_band(t) = O_anchor * (1 + sigma_t); O_anchor = price at 07:00 UTC; sigma_t = mean over last 14 days of |price(t)/price(07:00) - 1| at the same time of day t"
  short: "close < lower_band(t) = O_anchor * (1 - sigma_t)"
  order: market
stop: "trailing: long exits when 30m close < max(upper_band(t), session VWAP from 07:00); short exits when close > min(lower_band(t), VWAP)"
target: "none (trailing stop / time exit)"
time_exit: "20:55 UTC"
filters:
  - "position size = target_daily_vol / (14-day realized daily vol), capped at max leverage"
  - "may flip direction if opposite band is crossed; max 3 entries per day"
  - "optional gap adjustment: upper anchor = max(O_anchor, prior 21:00 close), lower = min(...), as in the paper"
params:
  anchor_utc:     {default: "07:00", grid: ["00:00", "07:00", "13:30"]}
  lookback_days:  {default: 14, grid: [10, 14, 20]}
  band_mult:      {default: 1.0, grid: [0.75, 1.0, 1.25, 1.5]}
  check_every:    {default: "30m", grid: ["15m", "30m", "60m"]}
  target_vol:     {default: 0.02, grid: [0.01, 0.02, 0.03]}
expected_frequency: "~0.5-1.5 entries per day"
claimed: "SPY 2007-2024: 1,985% total return net of costs, 19.6% annualised, Sharpe 1.33 (authors). Not validated on gold."
assumptions:
  - "Original anchors at the US cash open; London open anchor for gold is researcher choice"
  - "Translating the SPY session into a 07:00-20:55 UTC gold session is a researcher choice"
sources:
  - https://ideas.repec.org/p/chf/rpseri/rp2497.html
  - https://www.sfi.ch/de/publications/n-24-97-beat-the-market-an-effective-intraday-momentum-strategy-for-s-p500-etf-spy
  - https://bearbulltraders.com/wp-content/uploads/2024/08/Money_Show_Final.pdf
notes: "Time-of-day-specific volatility bands make breakouts comparable across sessions (gold vol is very uneven across the day). Different from T8 (first-minute NYSE momentum): hold time hours, bands adapt to time of day. Failure mode: range-bound regimes (e.g. 2026 tight range noted by CME) produce whipsaw; the vol-scaled sizing reduces but does not remove it."
---
id: academic-first-hh-last-hh-comex
name: First half-hour of COMEX day session predicts last half-hour (Gao-Han-Li-Zhou on gold)
mechanism: momentum
timeframe_signal: 1m
session: "08:20-08:50 NY signal, 13:00-13:30 NY trade (12:20/17:00 UTC EDT; 13:20/18:00 UTC EST)"
entry:
  long:  "at 13:00 NY: r1 = return 08:20->08:50 NY > 0 AND (optional) r_mid = return 08:50->13:00 NY has same sign"
  short: "at 13:00 NY: r1 < 0 (and optionally r_mid < 0)"
  order: market
stop: "2.5 * ATR14(1m) disaster stop"
target: "none (time exit)"
time_exit: "13:30 NY"
filters:
  - "trade only if |r1| > 60-day median |r1| (paper: stronger on high-volatility / high-volume days)"
  - "variant: only on major macro days (NFP, CPI, FOMC day), where paper finds effect strongest"
params:
  first_window:   {default: "08:20-08:50 NY", grid: ["08:20-08:50 NY", "07:00-07:30 UTC", "00:00-00:30 UTC (prev Globex reopen 18:00-18:30 NY)"]}
  mid_confirm:    {default: false, grid: [false, true]}
  vol_filter_pct: {default: 50, grid: [0, 50, 75]}
expected_frequency: "~0.5 per day"
claimed: "SPY 1993-2013: R2 ~2%; long/short last half-hour by first half-hour sign gave 6.3% gross annualised vs -0.5% buy-all-last-half-hours (CXO summary). Chinese copper/steel futures show same effect (Jin et al.)"
assumptions:
  - "Mapping 'first half-hour' to the COMEX 08:20 ET open (gold trades ~23h, so 'open' is ambiguous)"
  - "vol filter percentile and disaster stop are researcher choices"
sources:
  - https://alphaarchitect.com/2014/08/attention-prop-traders-the-first-half-hour-of-trading-predicts-the-last-half-hour/
  - https://cxoadvisory.com/calendar-effects/first-and-last-half-hours-of-trading-linked
  - https://hull-repository.worktribe.com/output/3295550
  - https://ideas.repec.org/a/eee/finlet/v58y2023ipas154461232300394x.html
notes: "Distinct from T7: T7 traded continuation/reversal immediately after the COMEX open; here the open's sign is used ~4.5h later. Chinese metals evidence shows the 'informative' first window moves when trading hours change (night session became predictor), so test several anchor windows. Low R2 means costs dominate; use tight-spread hours only."
