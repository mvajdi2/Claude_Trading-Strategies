id: academic-usd-residual-catchup
name: Gold catch-up to sharp USD moves (EURUSD-implied residual reversion)
mechanism: other
timeframe_signal: 5m
session: "07:00-20:00 UTC"
entry:
  long:  "res = r_XAU(30m) - beta * r_EURUSD(30m), beta = rolling 20-day OLS of 5m XAU on 5m EURUSD returns; if r_EURUSD(30m) > +2 sigma AND res < -1.5 sigma_res, buy XAU (gold lagged a USD sell-off)"
  short: "if r_EURUSD(30m) < -2 sigma AND res > +1.5 sigma_res, sell XAU"
  order: market
stop: "1.5 * ATR14(5m) * sqrt(6)"
target: "res returns to 0 (XAU move = beta * EURUSD move since signal start)"
time_exit: "60 min after entry or 20:55 UTC"
filters:
  - "require rolling 20-day correlation(XAU,EURUSD) on 5m returns > 0.3"
  - "skip 15 min around tier-1 US releases"
params:
  usd_z:          {default: 2.0, grid: [1.5, 2.0, 2.5]}
  res_z:          {default: 1.5, grid: [1.0, 1.5, 2.0]}
  window_min:     {default: 30, grid: [15, 30, 60]}
  min_corr:       {default: 0.3, grid: [0.2, 0.3, 0.5]}
expected_frequency: "~1-3 per week"
claimed: "none; daily/weekly literature: gold-USD index correlation about -0.75 (2018), gold vs 10y TIPS about -0.8 historically but unstable; CXO finds UUP-GLD weekly relation coincident (no lead)"
assumptions:
  - "Entire rule is researcher-made; needs EURUSD (or DXY) 1m data aligned to XAUUSD"
  - "Assumes intraday cross-asset adjustment is not instantaneous; evidence for a lead is weak"
sources:
  - https://www.lbma.org.uk/alchemist/issue-90/an-update-on-gold-real-interest-rates-and-the-dollar
  - https://cxoadvisory.com/?p=21168
  - https://www.marketpulse.com/?p=806288
notes: "Speculative and last-ranked: the evidence says gold and USD move coincidentally, so any lag is likely only during liquidity gaps. Keep only if data is already available; correlation has weakened in 2023-2026 (geopolitical / central-bank buying), so the min_corr gate matters."
