id: practitioners-asian-range-london-breakout
name: Asian-range London breakout with range-size filter (OCO stops, 2.5R)
mechanism: breakout
timeframe_signal: 1m
session: "range 00:00-05:00 UTC, orders live 05:00-21:00 UTC"
entry:
  long:  "at 05:00 UTC place buy stop at AsianHigh + buffer; Asian range = high/low of 00:00-05:00 UTC"
  short: "at 05:00 UTC place sell stop at AsianLow - buffer (OCO with the long)"
  order: stop
stop: "opposite side of the Asian range, capped at 0.6% of price"
target: "2.5R; move stop to break-even at +1.5R"
time_exit: "21:00 UTC"
filters:
  - "skip day if range < 0.30% or > 1.60% of price"
  - "max 1 trade per day (cancel the other leg on fill)"
params:
  range_end_utc:   {default: "05:00", grid: ["05:00", "06:00", "07:00"]}
  buffer_pct:      {default: 0.02, grid: [0.0, 0.02, 0.05]}
  target_r:        {default: 2.5, grid: [1.5, 2.0, 2.5, 3.0]}
  be_trigger_r:    {default: 1.5, grid: [1.0, 1.5, none]}
  min_range_pct:   {default: 0.30, grid: [0.2, 0.3, 0.4]}
  max_range_pct:   {default: 1.60, grid: [1.0, 1.3, 1.6]}
expected_frequency: "~0.7 per day (715 trades in 3.7y reported)"
claimed: "PF 1.38, maxDD 17.3% at 1% risk, real-tick MT5 Jan 2023-Sep 2026, 715 trades; 2026 holdout PF 1.61 on 157 trades (author blog)"
assumptions:
  - "Source states 03:00-08:00 SERVER time; converted assuming a GMT+3 server -> 00:00-05:00 UTC. Verify; London-open variant (range end 07:00 UTC) is in the grid."
  - "Buffer size not given in summary; 0.02% of price chosen by researcher"
sources:
  - https://www.mql5.com/en/blogs/post/777540
  - https://kr.tradingview.com/script/rCMX1vGE-GOLD-Asian-Range-Breakout-Signals/
  - https://www.mql5.com/en/blogs/post/777728
notes: >
  Differs from T7 (scheduled-anchor momentum/fade) by using a whole-session range, a range-size
  regime filter, wide structural stop and 2.5R target. Author found tight in-range stops and no
  range filter both hurt. Counter-evidence: an 18-year test of 288 gold breakout variants found
  little edge outside the post-2017 bull market; long-side results may be bull-drift. Report long
  and short legs separately and test pre-2023 data.
---
id: practitioners-asian-range-false-break-fade
name: Asian-range false breakout fade (break, close outside, close back inside)
mechanism: structure
timeframe_signal: 15m
session: "06:00-16:00 UTC"
entry:
  long:  "a 15m bar has closed below AsianLow (00:00-06:00 UTC); later a 15m bar closes back above AsianLow -> buy at that close"
  short: "a 15m bar has closed above AsianHigh; later a 15m bar closes back below AsianHigh -> sell at that close"
  order: market
stop: "beyond the extreme of the failed breakout + 0.1*ATR14(15m)"
target: "opposite side of the Asian range, or 2R if closer"
time_exit: "16:00 UTC"
filters:
  - "re-entry must happen within N bars of the first outside close"
  - "max 1 trade per day; skip if Asian range > 1.5*ATR14(1h)*6"
params:
  asian_end_utc:   {default: "06:00", grid: ["05:00", "06:00", "07:00"]}
  max_bars_outside: {default: 8, grid: [4, 8, 16]}
  target_mode:     {default: "opposite_side", grid: ["opposite_side", "1R", "2R", "range_mid"]}
expected_frequency: "~0.3-0.5 per day"
claimed: "none"
assumptions:
  - "Session times, stop, target, max-bars and range filter are researcher-chosen; the H1 script description gives only the logic"
  - "Signal bar moved from 1h (script) to 15m; 1h variant should also be run"
sources:
  - https://jp.tradingview.com/script/8Iv42BDE-Gold-H1-Breakout-Failure-V11-0
  - https://www.mql5.com/en/blogs/post/773690
  - https://www.forexfactory.com/thread/post/14806417
notes: >
  Mirror image of the London breakout card: practitioners claim the first break of the Asian
  range is often the liquidity grab. Coding both on the same data shows which side carries the
  effect. Differs from T4 (sub-5s sweep of 15/30-min levels) in timescale and level: session range,
  15m bar closes, hold for hours.
---
id: practitioners-pdh-pdl-sweep-reclaim
name: Previous-day high/low sweep and reclaim (gold turtle soup, 15m)
mechanism: structure
timeframe_signal: 15m
session: "07:00-17:00 UTC"
entry:
  long:  "15m bar trades below PDL and closes back above PDL with close > open and lower wick > upper wick -> buy at close"
  short: "15m bar trades above PDH and closes back below PDH with close < open and upper wick > lower wick -> sell at close"
  order: market
stop: "beyond sweep-bar extreme + 0.1*ATR14(15m)"
target: "1.5R"
time_exit: "20:00 UTC"
filters:
  - "optional EMA200(15m) bias: longs only above, shorts only below"
  - "sweep depth beyond PDH/PDL <= 0.5*ATR14(15m) (deeper = real breakout)"
  - "max 1 trade per side per day"
params:
  target_r:       {default: 1.5, grid: [1.0, 1.5, 2.0, 3.0]}
  max_sweep_atr:  {default: 0.5, grid: [0.25, 0.5, 1.0]}
  ema_filter:     {default: false, grid: [false, true]}
expected_frequency: "~0.3 per day"
claimed: "none"
assumptions:
  - "Day boundary for PDH/PDL = 22:00 UTC (NY close); researcher choice"
  - "Sweep-depth cap and session window are researcher-chosen"
sources:
  - https://cn.tradingview.com/script/hLV3gFmw
  - https://www.mql5.com/ko/market/product/187490
  - https://es.tradingview.com/scripts/asian
notes: >
  Raschke turtle-soup family on daily levels. Differs from T1-T4 (sub-5s spark/sweep reversals of
  15/30-min levels) by using once-per-day levels and 15m closes rather than tick flow, so costs
  are a small fraction of the move.
---
id: practitioners-shanghai-open-orb
