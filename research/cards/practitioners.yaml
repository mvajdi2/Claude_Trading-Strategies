  short: "first 1m close below range low -> sell"
  order: market
stop: "fixed 5.0 USD (50 GC ticks); alt: opposite side of range"
target: "fixed 10.0 USD (100 ticks) = 2R"
time_exit: "06:00 UTC"
filters: ["max 1 trade per day", "only first trigger after range completes"]
params:
  range_start_utc: {default: "01:30", grid: ["01:00", "01:30", "02:30"]}
  range_minutes:   {default: 5, grid: [5, 15, 30]}
  stop_usd:        {default: 5.0, grid: [2.5, 5.0, 7.5, "range"]}
  target_r:        {default: 2.0, grid: [1.0, 1.5, 2.0]}
expected_frequency: "~1 per day"
claimed: "none"
assumptions:
  - "Script uses 8:30-8:35 pm US Central; converted to 01:30 UTC (CDT). In US winter it is 02:30 UTC; the session anchor should follow the Shanghai clock (UTC+8), so 01:30 UTC = 09:30 Beijing. Grid includes 01:00 (SGE 09:00 open)."
  - "Fixed USD stop/target were set at older gold prices; consider scaling by price or ATR"
  - "Time exit chosen by researcher"
sources:
  - https://www.tradingview.com/script/Edp98cOR-GC-Shanghai-ORB-Simple-1m-Close-Trigger-v6
notes: >
  T7 covered the Tokyo open but not the Shanghai/SGE open. Chinese demand is a plausible driver of
