---
id: practitioners-asia-hours-drift
name: Asian-hours long drift ("hat-shaped" gold seasonality)
mechanism: session_time
timeframe_signal: 1h
session: "00:00-07:00 UTC (long leg); optional 08:00-20:00 UTC (short leg)"
entry:
  long:  "buy at 00:00 UTC open every trading day"
  short: "optional: sell at 08:00 UTC open, exit 20:00 UTC"
  order: market
stop: "none, or 2*ATR14(1h) catastrophe stop"
target: "none (time exit)"
time_exit: "07:00 UTC for long leg; 20:00 UTC for short leg"
filters:
  - "variant: only trade long leg when prior 08:00-20:00 return < 0"
  - "skip Mondays (weekend gap) as a variant"
params:
  entry_utc: {default: "00:00", grid: ["23:00", "00:00", "01:00"]}
  exit_utc:  {default: "07:00", grid: ["05:00", "06:00", "07:00", "08:00"]}
  legs:      {default: "long_only", grid: ["long_only", "short_only", "both"]}
expected_frequency: "1 per day per leg"
claimed: "Sharpe up to 1.61 before costs; underperforms buy-and-hold after costs but still somewhat profitable (CBS master's thesis, 2019)"
assumptions:
  - "Exact Eastern-hours window not in abstract; 00:00-07:00 UTC chosen by researcher"
  - "Stop and filters are researcher-chosen"
sources:
  - https://research.cbs.dk/en/studentProjects/gold-price-dynamics-around-the-clock/
  - https://reading-clone.eprints-hosting.org/79175/1/BattenLuceyMcGroartyPeatUrquhart2017.pdf
notes: >
  Low-turnover, no-indicator baseline. Main risk: the long leg is contaminated by gold's secular
  uptrend, so always compare against an equal-length random-hour long and report the short leg.
  Not covered by T7 (anchors x short reactions) because it holds a whole session.
---
id: practitioners-ny-supertrend-rsi
