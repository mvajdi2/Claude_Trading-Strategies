mechanism: vwap
timeframe_signal: 5m
session: "07:00-20:00 UTC"
entry:
  long:  "VWAP anchored 00:00 UTC; close < VWAP - 3*sd -> next bar closes back above lower band -> buy"
  short: "close > VWAP + 3*sd -> next bar closes back below upper band -> sell"
  order: market
stop: "extreme of the excursion + 0.25*ATR14(5m)"
target: "VWAP (or 1sd band as partial)"
time_exit: "20:00 UTC or 3h after entry"
filters:
  - "prefer longs when daily VWAP slope > 0, shorts when < 0 (variant)"
  - "skip if trend filter shows strong trend: |EMA50 slope| > k*ATR (gold MR fails in trends)"
params:
  band_sd:      {default: 3.0, grid: [2.0, 2.5, 3.0]}
  anchor:       {default: "00:00 UTC", grid: ["00:00 UTC", "07:00 UTC", "13:30 UTC"]}
  slope_filter: {default: false, grid: [false, true]}
expected_frequency: "~0.5-1 per day"
claimed: "none"
assumptions:
  - "VWAP anchor, sd computation (volume-weighted variance on tick volume), stop and trend filter are researcher-chosen"
  - "Spot XAUUSD has only tick volume; use tick count as weight"
sources:
  - https://kr.tradingview.com/script/fVu5DNuk/
  - https://it.tradingview.com/script/uqFwueXb-AURUM-5-Gold-Engine-Trend-VWAP-MR-EBP-5m
  - https://www.mql5.com/en/blogs/post/774959
notes: >
  Only VWAP/value idea in this lane. 774959 warns mean reversion on gold earns in ranges then
