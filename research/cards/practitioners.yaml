id: practitioners-london-range-break-retest
name: London-range break and retest continuation in NY session
mechanism: breakout
timeframe_signal: 5m
session: "12:00-19:00 UTC"
entry:
  long:  "London range = 07:00-12:00 UTC high/low; a 15m bar closes above LondonHigh after 12:00; within 12 bars (5m) price retraces to within 0.1*ATR14(15m) of LondonHigh and a 5m bar closes back up (close > open, close > LondonHigh) -> buy at close"
  short: "mirror below LondonLow"
  order: market
stop: "LondonHigh - 0.5*ATR14(15m) (long); mirror for short"
target: "2R"
time_exit: "19:00 UTC"
filters:
  - "breakout bar range >= 0.8*ATR14(15m) (displacement)"
  - "skip if London range > 2*ATR14(1h)*5 (already extended)"
  - "max 1 trade per day"
params:
  retest_window_bars: {default: 12, grid: [6, 12, 24]}
  stop_atr:           {default: 0.5, grid: [0.3, 0.5, 1.0]}
  target_r:           {default: 2.0, grid: [1.0, 1.5, 2.0, 3.0]}
expected_frequency: "~0.3 per day"
claimed: "none"
assumptions:
  - "Source describes break-retest-continue behaviour only; all levels, windows and numbers researcher-chosen"
sources:
  - https://www.mql5.com/en/blogs/post/772513
  - https://www.mql5.com/en/blogs/post/773690
  - https://www.gomarkets.com/ko-kr/articles/the-break-and-retest---trading-setups
notes: >
  Answers the common complaint that gold breakouts reverse to the level before running. Differs
  from T5 (retest limit after spike rejection = reversal) because it is a continuation entry
  after a confirmed 15m close, entered on a confirming bar, not a resting limit.
