id: practitioners-ict-silver-bullet-fvg
name: ICT Silver Bullet (liquidity raid + 5m FVG limit, 10-11 and 14-15 NY)
mechanism: structure
timeframe_signal: 5m
session: "14:00-15:00 UTC and 18:00-19:00 UTC in US summer (10-11 and 14-15 New York)"
entry:
  long:  "in window, after price has traded below one of {Asia low, London low, 09:00 NY 1h low}: a bullish 3-bar FVG forms (low[0] > high[2]) -> buy limit at top of FVG"
  short: "after a raid above one of {Asia high, London high, 09:00 NY high}: bearish FVG (high[0] < low[2]) -> sell limit at bottom of FVG"
  order: limit
stop: "beyond candle 1 of the FVG (wick)"
target: "2R, or nearest opposite liquidity level"
time_exit: "unfilled limits cancel at window end; open trades close 20:00 UTC"
filters:
  - "min FVG size >= 0.2*ATR14(5m)"
  - "if both highs and lows were raided, skip"
  - "max 1 win per window"
params:
  min_fvg_atr: {default: 0.2, grid: [0.1, 0.2, 0.4]}
  stop_mode:   {default: "wick", grid: ["wick", "body"]}
  target_r:    {default: 2.0, grid: [1.0, 2.0, 3.0]}
  windows:     {default: "both", grid: ["am", "pm", "both"]}
expected_frequency: "~0.5-1 per day"
claimed: "none"
assumptions:
  - "Asia = 00:00-06:00 UTC, London = 07:00-11:00 UTC; researcher-defined"
  - "FVG size floor, both-sides-raided rule and targets are researcher choices (script leaves them open)"
sources:
  - https://my.tradingview.com/script/K6B5kxjJ-ICT-Silver-Bullet-JadeCap
  - https://ctrader.com/id/products/4984
notes: >
  Very popular on YouTube. Limit entry risks the adverse selection seen in T5, so also run a
  market-on-FVG-close variant. Differs from T8 (first-minute NYSE momentum) in that it requires a
  prior session-level raid and enters on a retrace 30-90 min after the open.
---
